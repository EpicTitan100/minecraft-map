<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minecraft Map</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.5.2/mapbox-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>
  <div id="ui">
    <h1>Minecraft Map</h1>
    <p>Real world, blocky look</p>
    <div class="controls">
      <button id="btn-blocky">Blocky terrain</button>
      <button id="btn-real">Real terrain</button>
      <div class="coord" id="coord">—</div>
    </div>
  </div>
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.5.2/mapbox-gl.js"></script>
  <script src="script.js"></script>
</body>
</html>
